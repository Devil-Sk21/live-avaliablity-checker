name: 24/7 Laptop Stock Sniper

on:
  schedule:
    # Runs every 5 minutes, 24 hours a day, 7 days a week
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Stock Scanner & Phone Alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          python cloud_sniper.py --once --pincode 360005
